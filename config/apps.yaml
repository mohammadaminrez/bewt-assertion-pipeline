apps:
  bludit:
    versions:
      - "3.13.1"
    base_url: "http://localhost:8080"
    variant: "baseline"
    docker_compose: null  # Set path to docker-compose.yml
    # Fresh-app container and the directory holding all app state, used by
    # the reference run to snapshot/restore state around each test.
    docker:
      image: "bludit/docker:3.13.1"
      container: "bludit"
      ports: "8080:80"
      state_dir: "/usr/share/nginx/html/bl-content"
    credentials:
      username: "admin"
      password: "0f5c3cc1b73dce21d0c5516033185f86"

  claroline:
    versions:
      - "1.11.10"
    base_url: "http://localhost:3000"
    variant: "baseline"
    docker_compose: null
    # Installed Claroline with MySQL in the same container (amd64 only).
    # State = the site files (courses, config) + the database.
    docker:
      image: "olianasd/claroline-strongpsw"
      platform: "linux/amd64"
      container: "claroline"
      ports: "3000:80"
      state_dir: "/var/www/html/claroline11110"
      mysql_password: "root"
      mysql_database: "claroline"
    credentials:
      username: "admin"
      password: "admin"

  expresscart:
    versions:
      - "1.19"
    base_url: "http://localhost:3000"
    variant: "baseline"
    docker_compose: null
    credentials:
      admin_email: "owner@test.com"
      admin_password: "e2eW3Bt3s71nGB3nchM4rK"
      user_email: "test@test.com"
      user_password: "e2eW3Bt3s71nGB3nchM4rK"

  joomla:
    versions:
      - "4.2.0"
    base_url: "http://localhost:3000"
    variant: "baseline"
    docker_compose: null
    # Installed Joomla with MySQL in the same container (amd64 only). State =
    # the site files + the database. The image ships a stale apache2.pid
    # that makes Apache exit at boot, so it is removed first.
    docker:
      image: "olianasd/joomla4stile"
      platform: "linux/amd64"
      container: "joomla"
      ports: "3000:80"
      command: "rm -f /var/run/apache2/apache2.pid && exec /run.sh"
      state_dir: "/app"
      mysql_database: "joomla_db"
    credentials:
      username: "admin"
      password: "admin"

  kanboard:
    versions:
      - "1.2.15"
    base_url: "http://localhost:8080"
    variant: "baseline"
    docker_compose: null
    credentials:
      username: "admin"
      password: "admin"

  mantisbt:
    versions:
      - "2.25.4"
    base_url: "http://localhost:8989"
    variant: "baseline"
    docker_compose: null
    # BEWT's docker-compose.yml (app + MariaDB). The benchmark's Installer,
    # kept outside TestSuite, runs the install wizard and sets the admin
    # password. State = the generated config + the database.
    setup_class: "Installer"
    docker:
      compose_file: "docker-compose.yml"
      container: "mantisbt-mantisbt-1"
      state_dir: "/var/www/html/config"
      mysql_container: "mantisbt-mysql-1"
      mysql_password: "e2eW3Bt3s71nGB3nchM4rK"
      mysql_database: "bugtracker"
    credentials:
      username: "administrator"
      password: "root"

  mediawiki:
    versions:
      - "1.40.0"
    base_url: "http://localhost:8080"
    variant: "baseline"
    docker_compose: null
    credentials:
      username: "admin"
      password: "admin"

  prestashop:
    versions:
      - "1.7.8.5"
    base_url: "http://localhost:8080"
    variant: "baseline"
    docker_compose: null
    credentials:
      username: "admin"
      password: "admin"

bewt_repo_path: "../BEWT"
output_dir: "./output"
dante_repo_path: "~/dante"
